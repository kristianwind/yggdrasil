name: CI

# The safety gate for pull requests: build, vet and test the Go backend and
# compile the Svelte frontend. Auto-merge (auto-merge.yml) only fires when this
# succeeds, so nothing lands on main without passing here.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Frontend FIRST: web/dist is gitignored and embedded via `//go:embed
      # all:web/dist`, so it must exist before any `go build`/`test`/`docs-gen`.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Frontend test and build (compiles the Svelte app + produces web/dist)
        run: |
          if [ -f web/package.json ]; then
            cd web
            npm ci
            npm test
            npm run build
          else
            echo "No web/package.json — skipping frontend build."
            mkdir -p web/dist  # keep the go:embed pattern satisfied
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Match the release build (pinned for the stdlib security fixes).
          go-version: "1.26.x"

      - name: Go build / vet / test
        run: |
          go build ./...
          go vet ./...
          go test ./...

      # website/docs/ is generated from docs/*.md and committed, so the static
      # site needs no build step to deploy. That only holds if the two stay in
      # sync — regenerate and fail if the working tree moves.
      - name: Docs site is up to date with docs/
        run: |
          go run ./cmd/docs-gen
          if ! git diff --quiet -- website/docs; then
            echo "::error::website/docs/ is stale. Run 'go run ./cmd/docs-gen' and commit the result."
            git diff --stat -- website/docs
            exit 1
          fi
          echo "website/docs/ matches docs/."

      # The same guarantee for the apps catalogue, which had none. website/apps/
      # is generated from the runes, so adding a rune must add its card in the
      # same commit — and until now nothing checked that. The failure is quiet by
      # construction: main gets a rune, the catalogue does not, and the site keeps
      # serving a page that is correct-looking and wrong. It has already happened
      # once (two runes missing for days, found by hand on 2026-08-28).
      #
      # apps-gen vendors icons from a CDN, so this step must not need the network
      # for a tree that is already complete: an icon already in website/icons/ is
      # never re-fetched, whatever its extension. If this step fails on a PR that
      # adds a rune, the fix is to run apps-gen locally and commit the icon it
      # downloads along with the page.
      - name: Apps catalogue is up to date with the runes
        run: |
          go run ./cmd/apps-gen
          if ! git diff --quiet -- website/apps website/icons; then
            echo "::error::website/apps/ is stale. Run 'go run ./cmd/apps-gen' and commit the result."
            git diff --stat -- website/apps website/icons
            exit 1
          fi
          echo "website/apps/ matches the runes."
