name: Rune images

# Images that runes pull have to be anonymously pullable, so they are published
# to GHCR rather than to the Gitea mirror (Gitea's container packages need auth
# even when the repo is public, and the panel has no registry credentials).
on:
  # Tags only, plus the manual button — deliberately NOT `push: branches: [main]`.
  #
  # Auto-merge merges with GITHUB_TOKEN, and GitHub does not start new workflow
  # runs from pushes made with that token; it is the loop guard. Since every PR
  # in this repo is auto-merged, a main-branch trigger has effectively never
  # fired, and nothing was red to say so — the images just quietly stayed at
  # whatever version somebody last built by hand.
  #
  # A tag is pushed by a person with a personal token, so it does trigger. That
  # also puts image publishing at the moment it matters: a release. A path filter
  # is not used, because path filtering against a tag push is not something to
  # rely on, and two small image builds per release cost nothing.
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  claude-code-rc:
    runs-on: ubuntu-latest
    # The Gitea mirror runs .github/workflows too, and it has neither GHCR
    # credentials nor the runner capacity to spare — keep this to GitHub.
    if: github.server_url == 'https://github.com'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only: the fleet the panel runs on is amd64, and cross-building the
      # Node + apt layers under QEMU costs far more than it buys.
      - uses: docker/build-push-action@v6
        with:
          context: docker/claude-code-rc
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/claude-code-rc:latest

  # The proxmox-backup-client used by PBS backup targets. Not a rune, but the
  # same constraint applies and for the same reason: the panel pulls it with no
  # registry credentials, so it has to be anonymously pullable.
  pbs-client:
    runs-on: ubuntu-latest
    if: github.server_url == 'https://github.com'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only, and this one is not a choice: Proxmox publishes no arm64
      # build of the backup client, which is why the panel refuses PBS targets
      # on other architectures rather than shipping an image that cannot exec.
      - uses: docker/build-push-action@v6
        with:
          context: deploy/pbs-client
          platforms: linux/amd64
          push: true
          # Both tags, and the version one is what the panel actually pulls
          # (internal/api/pbs.go). :latest exists for people poking at it by hand
          # — a backup tool should not float, so nothing in the product uses it.
          tags: |
            ghcr.io/${{ github.repository_owner }}/yggdrasil-pbs-client:4.0.19
            ghcr.io/${{ github.repository_owner }}/yggdrasil-pbs-client:latest
