gameskill:
  id: minecraft-bedrock
  name: "Minecraft (Bedrock)"
  category: "Minecraft"
  description: "Mojang Bedrock dedicated server via the maintained itzg/minecraft-bedrock-server image. It handles the BDS download, a proper libcurl + CA trust, and the Minecraft-services handshake that a bare base image gets wrong — so ONLINE MODE and the allow-list actually work. No RCON — console only."
  author: "yggdrasil-core"
  version: 4
  icon: "minecraft"

  # itzg's image bundles a working libcurl + CA store and manages server.properties
  # from these env vars on every start. Starts as root and drops to UID/GID (chowns
  # /data so ownership self-heals). x86_64 only — Mojang ships no arm64 BDS.
  docker:
    image: "itzg/minecraft-bedrock-server:latest"
    data_path: /data
    keep_entrypoint: true
    user: "0:0"
    env:
      EULA: "{{EULA}}"
      SERVER_NAME: "{{SERVER_NAME}}"
      GAMEMODE: "{{GAMEMODE}}"
      DIFFICULTY: "{{DIFFICULTY}}"
      MAX_PLAYERS: "{{MAX_PLAYERS}}"
      ONLINE_MODE: "{{ONLINE_MODE}}"
      ALLOW_LIST: "{{ALLOW_LIST}}"
      LEVEL_SEED: "{{LEVEL_SEED}}"

  variables:
    - key: SERVER_NAME
      name: "Server name"
      type: string
      default: "Yggdrasil Bedrock"
    - key: GAMEMODE
      name: "Default gamemode"
      type: select
      options: [survival, creative, adventure]
      default: survival
    - key: DIFFICULTY
      name: "Difficulty"
      type: select
      options: [peaceful, easy, normal, hard]
      default: easy
    - key: MAX_PLAYERS
      name: "Max players"
      type: int
      default: 10
    - key: ONLINE_MODE
      name: "Online mode (require Xbox authentication — keep ON for a real allow-list)"
      type: bool
      default: true
    - key: ALLOW_LIST
      name: "Enable allow-list (whitelist) — only works meaningfully with online mode ON"
      type: bool
      default: false
    - key: LEVEL_SEED
      name: "World seed (leave blank for a random world)"
      type: string
      default: ""
    - key: EULA
      name: "Accept the Minecraft EULA and Privacy Policy"
      type: bool
      default: false
      required: true

  # No custom install: itzg's entrypoint downloads BDS and applies the env config.
  startup:
    command: ""
    done_regex: 'Server started'
    stop: "stop"

  query:
    type: minecraft-bedrock

  rcon:
    enabled: false   # Bedrock has no RCON; commands go to the container stdin

  config_files:
    - "server.properties"
    - "allowlist.json"
    - "permissions.json"

  ports:
    - { name: game,  default: 19132, protocol: udp }
    - { name: game6, default: 19133, protocol: udp }

  backup:
    include: ["worlds", "server.properties", "allowlist.json", "permissions.json"]
