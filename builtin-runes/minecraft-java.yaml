gameskill:
  id: minecraft-java
  name: "Minecraft (Java)"
  category: "Minecraft"
  description: "Vanilla / Paper / Purpur / Fabric / Forge / NeoForge Java server, or a CurseForge modpack"
  author: "yggdrasil-core"
  version: 15
  icon: "minecraft"

  docker:
    # The JRE image depends on the resolved Java version (see install step).
    image: "eclipse-temurin:{{JAVA_VERSION}}-jre"

  variables:
    - key: SERVER_TYPE
      name: "Server software"
      type: select
      options: [vanilla, paper, purpur, fabric, forge, neoforge, curseforge]
      default: paper
    # The four below are read only when Server software is "curseforge". They are
    # always on the form because a rune variable has no way to say "only show me
    # for one value of another one"; everything else ignores them.
    - key: CF_MODPACK
      name: "CurseForge modpack — the pack's page address (only used by 'curseforge')"
      type: string
      default: ""
    - key: CF_FILE_ID
      name: "Pack version to install (blank = newest; the number at the end of a file's address)"
      type: string
      default: ""
    - key: CF_API_KEY
      name: "CurseForge API key — free from console.curseforge.com"
      type: string
      default: ""
      secret: true
    - key: CF_SERVERPACK_URL
      name: "Direct server-pack .zip address — skips CurseForge entirely (no key needed)"
      type: string
      default: ""
    - key: MC_VERSION
      name: "Minecraft version"
      type: string
      default: "latest"
    # Which Java a server needs is decided by its Minecraft version, and old
    # modpacks are the reason 8 and 11 are here: Minecraft 1.12 will not start on
    # anything newer, and nothing newer than 1.16 will start on 8. The install
    # works out what the pack wants and says so when this does not match.
    - key: JAVA_VERSION
      name: "Java runtime (1.21+ → 21 or 25 · 1.17–1.20.4 → 17 · 1.16 and older → 8)"
      type: select
      options: ["25", "21", "17", "11", "8"]
      default: "25"
    - key: MEMORY_MB
      name: "Max RAM (MB)"
      type: int
      default: 4096
    - key: LEVEL_SEED
      name: "World seed (blank = random)"
      type: string
      default: ""
    - key: LEVEL_TYPE
      name: "World type (only applies to a new world)"
      type: select
      options: [normal, flat, large_biomes, amplified]
      default: normal
    # Hardcore is NOT one of these. Minecraft's difficulty is peaceful/easy/
    # normal/hard, and hardcore is a separate boolean that forces hard and makes
    # death permanent. Players who wanted it were typing "hardcore" into
    # server.properties by hand, where it is not a value Minecraft accepts — and
    # the startup re-stamp below then wrote this setting back over the edit, so
    # it looked like the panel was resetting their difficulty. It was.
    - key: DIFFICULTY
      name: "Difficulty (hardcore is the separate switch below)"
      type: select
      options: [peaceful, easy, normal, hard]
      default: easy
    - key: HARDCORE
      name: "Hardcore — death is permanent and the world is locked to hard"
      type: bool
      default: false
    - key: RCON_PORT
      name: "RCON port (container-internal)"
      type: int
      default: 25575
    - key: RCON_PASSWORD
      name: "RCON password"
      type: string
      default: "change-me"
    - key: ENABLE_WHITELIST
      name: "Enable whitelist (only listed players can join)"
      type: bool
      default: false
    - key: EULA
      name: "Accept the Minecraft EULA"
      type: bool
      default: false
      required: true

  install:
    image: "eclipse-temurin:21-jre"
    script: |
      set -eu
      # eclipse-temurin is Ubuntu-based; add curl + jq for robust JSON parsing.
      # DEBIAN_FRONTEND and the stderr redirect are not tidiness: without them
      # apt's debconf writes eight lines about a terminal it cannot find into the
      # install log, which is the log an admin reads to find out why an install
      # failed -- and it is long enough to push the actual error off the screen.
      export DEBIAN_FRONTEND=noninteractive
      if ! command -v curl >/dev/null 2>&1 || ! command -v jq >/dev/null 2>&1; then
        apt-get update -qq >/dev/null 2>&1
        apt-get install -y -qq curl ca-certificates jq >/dev/null 2>&1
      fi

      TYPE="{{SERVER_TYPE}}"
      VER="{{MC_VERSION}}"
      BUILD=""
      MANIFEST=https://launchermeta.mojang.com/mc/game/version_manifest_v2.json
      # Forge's build promotions. NOT on maven.minecraftforge.net — that host
      # 404s for this file; files.minecraftforge.net serves it.
      FORGE_PROMOS=https://files.minecraftforge.net/net/minecraftforge/forge/promotions_slim.json
      NEOFORGE_META=https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml

      latest_vanilla() { curl -fsSL "$MANIFEST" | jq -r '.latest.release'; }
      need() { [ -n "$1" ] && [ "$1" != "null" ] || { echo "$2"; exit 1; }; }

      echo "Installing $TYPE (requested version: $VER)"
      # Switching a server from Forge to anything else must not leave the launch
      # marker behind, or startup would keep launching Forge from a stale args
      # file. Only the forge branch below writes it back.
      rm -f .ygg_forge_args .ygg_loader
      case "$TYPE" in
        vanilla)
          [ "$VER" = "latest" ] && VER="$(latest_vanilla)"
          need "$VER" "could not resolve latest Minecraft version"
          VER_URL=$(curl -fsSL "$MANIFEST" | jq -r --arg v "$VER" '.versions[] | select(.id==$v) | .url')
          need "$VER_URL" "version $VER not found"
          SRV_URL=$(curl -fsSL "$VER_URL" | jq -r '.downloads.server.url')
          need "$SRV_URL" "no server download for $VER"
          curl -fsSL -o server.jar "$SRV_URL"
          BUILD="$VER"
          ;;
        paper)
          # Paper v3 (fill) API — v2 is frozen at 1.21.x. Newest version is the
          # first patch of the first version group.
          UA="yggdrasil-installer"
          if [ "$VER" = "latest" ]; then
            VER=$(curl -fsSL -A "$UA" https://fill.papermc.io/v3/projects/paper | jq -r '.versions | to_entries[0].value[0]')
          fi
          need "$VER" "could not resolve Paper version"
          BJSON=$(curl -fsSL -A "$UA" "https://fill.papermc.io/v3/projects/paper/versions/$VER/builds/latest")
          # printf, not echo: dash's echo expands backslash escapes, and Paper's
          # build JSON carries \n inside the commit message — echo turns those into
          # real newlines and jq then rejects the string as unescaped control chars.
          URL=$(printf '%s' "$BJSON" | jq -r '.downloads["server:default"].url')
          BUILD=$(printf '%s' "$BJSON" | jq -r '.id // .build // empty')
          need "$URL" "no Paper build for $VER"
          curl -fsSL -A "$UA" -o server.jar "$URL"
          ;;
        purpur)
          [ "$VER" = "latest" ] && VER=$(curl -fsSL https://api.purpurmc.org/v2/purpur | jq -r '.versions[-1]')
          need "$VER" "could not resolve Purpur version"
          BUILD=$(curl -fsSL "https://api.purpurmc.org/v2/purpur/$VER/latest" | jq -r '.build // empty')
          curl -fsSL -o server.jar "https://api.purpurmc.org/v2/purpur/$VER/latest/download"
          ;;
        fabric)
          [ "$VER" = "latest" ] && VER="$(latest_vanilla)"
          need "$VER" "could not resolve Minecraft version for Fabric"
          LOADER=$(curl -fsSL "https://meta.fabricmc.net/v2/versions/loader/$VER" | jq -r '.[0].loader.version')
          INSTALLER=$(curl -fsSL https://meta.fabricmc.net/v2/versions/installer | jq -r '.[0].version')
          need "$LOADER" "no Fabric loader for $VER"
          need "$INSTALLER" "no Fabric installer"
          curl -fsSL -o server.jar \
            "https://meta.fabricmc.net/v2/versions/loader/$VER/$LOADER/$INSTALLER/server/jar"
          BUILD="$LOADER"
          ;;
        forge)
          [ "$VER" = "latest" ] && VER="$(latest_vanilla)"
          need "$VER" "could not resolve Minecraft version for Forge"
          # Forge numbers its own builds per Minecraft version. Take the one it
          # recommends; fall back to its newest for a version too fresh to have a
          # recommendation yet.
          FV=$(curl -fsSL "$FORGE_PROMOS" | jq -r --arg v "$VER" '.promos[$v+"-recommended"] // .promos[$v+"-latest"] // empty')
          need "$FV" "Forge has no build for Minecraft $VER"
          FULL="$VER-$FV"
          echo "Forge $FULL - running the installer (this patches Minecraft and takes a minute)"
          curl -fsSL -o forge-installer.jar \
            "https://maven.minecraftforge.net/net/minecraftforge/forge/$FULL/forge-$FULL-installer.jar"
          # --installServer is the only supported way in: it downloads the vanilla
          # server, patches it, and writes the library tree the launch args point at.
          java -jar forge-installer.jar --installServer
          rm -f forge-installer.jar forge-installer.jar.log
          # 1.17+ Forge has NO runnable server.jar. It ships an @argfile instead,
          # and that file is what startup launches. Record where it landed.
          FARGS="libraries/net/minecraftforge/forge/$FULL/unix_args.txt"
          [ -f "$FARGS" ] || { echo "Forge installed but produced no $FARGS - this rune supports Forge for Minecraft 1.17 and newer"; exit 1; }
          printf '%s\n' "$FARGS" > .ygg_forge_args
          BUILD="$FV"
          ;;
        neoforge)
          [ "$VER" = "latest" ] && VER="$(latest_vanilla)"
          need "$VER" "could not resolve Minecraft version for NeoForge"
          # NeoForge numbers itself after the Minecraft version with the leading
          # "1." dropped: MC 1.21.4 -> 21.4.x, and the newer scheme straight
          # through -> MC 26.2 -> 26.2.x. One rule covers both.
          NF_PREFIX=$(echo "$VER" | sed 's/^1\.//')
          NF=$(curl -fsSL "$NEOFORGE_META" \
               | grep -oE '<version>[^<]+</version>' | sed -E 's|</?version>||g' \
               | grep "^${NF_PREFIX}\." | grep -vi 'beta' | tail -1)
          # Two real cases end here, and the message has to say which: NeoForge
          # did not exist before Minecraft 1.20.2, and a version released days
          # ago has no NeoForge build yet.
          need "$NF" "NeoForge has no build for Minecraft $VER (it starts at 1.20.2, and a just-released version may not have one yet)"
          echo "NeoForge $NF - running the installer (this patches Minecraft and takes a minute)"
          curl -fsSL -o neoforge-installer.jar \
            "https://maven.neoforged.net/releases/net/neoforged/neoforge/$NF/neoforge-$NF-installer.jar"
          java -jar neoforge-installer.jar --installServer
          rm -f neoforge-installer.jar neoforge-installer.jar.log
          # Same shape as modern Forge: no runnable server.jar, an @argfile
          # instead. Different path, same marker — startup reads whatever path
          # this file holds, so nothing there needs to know which of the two it is.
          FARGS="libraries/net/neoforged/neoforge/$NF/unix_args.txt"
          [ -f "$FARGS" ] || { echo "NeoForge installed but produced no $FARGS"; exit 1; }
          printf '%s\n' "$FARGS" > .ygg_forge_args
          BUILD="$NF"
          ;;
        curseforge)
          # --- CurseForge modpack ------------------------------------------
          # A server pack is whatever its author chose to zip up, so nothing here
          # assumes a layout: the pack is unpacked, then asked how it wants to be
          # launched, in order of how definite the answer is.
          #
          # CurseForge serves nothing anonymously -- its API needs a free key from
          # console.curseforge.com. The two key-free routes are checked FIRST and
          # not as a fallback, because a pack whose author switched third-party
          # downloads off cannot be fetched through the API at all (not by this
          # panel and not by any other), and a hand-downloaded zip is then the
          # only way in. Checking them first means that route never needs a key
          # the user would otherwise be told to go and create for nothing.
          if ! command -v unzip >/dev/null 2>&1; then
            apt-get update -qq >/dev/null 2>&1 || true
            apt-get install -y -qq unzip >/dev/null 2>&1
          fi

          CF_API=https://api.curseforge.com/v1
          cfapi() { curl -fsSL -H "x-api-key: ${CF_API_KEY:-}" -H "Accept: application/json" "$1" || true; }
          # Ask once, by hand, whether the key works. Every call goes through
          # cfapi, which swallows a failure so the error can name the step --
          # without this check they would all fail identically and blame the pack
          # for a key CurseForge rejected.
          cf_need_key() {
            [ -n "${CF_API_KEY:-}" ] || { echo "$1"; exit 1; }
            HTTP=$(curl -s -o /dev/null -w '%{http_code}' -H "x-api-key: $CF_API_KEY" -H "Accept: application/json" "$CF_API/games/432")
            case "$HTTP" in
              200) ;;
              401|403) echo "CurseForge rejected the API key (HTTP $HTTP). Check it at https://console.curseforge.com/ and paste it again."; exit 1 ;;
              *) echo "CurseForge did not answer (HTTP $HTTP). Try the install again in a minute."; exit 1 ;;
            esac
          }
          ZIP=.ygg_cf_pack.zip
          PACK_ID=""   # recorded, so the next install can tell the pack changed
          MCV=""       # Minecraft version the pack declares, when we can learn it
          rm -f "$ZIP"

          if [ -n "${CF_SERVERPACK_URL:-}" ]; then
            echo "Downloading the server pack from the address in settings"
            curl -fsSL -o "$ZIP" "$CF_SERVERPACK_URL"
            PACK_ID="url-$(printf '%s' "$CF_SERVERPACK_URL" | md5sum | cut -c1-12)"
          elif [ -s modpack.zip ]; then
            echo "Using modpack.zip from this server's files"
            cp modpack.zip "$ZIP"
            PACK_ID="file-$(md5sum modpack.zip | cut -c1-12)"
          else
            [ -n "${CF_MODPACK:-}" ] || { echo "No modpack chosen. Open the pack on curseforge.com and paste the whole page address into 'CurseForge modpack'. Or skip CurseForge: put a server-pack .zip address in 'Direct server-pack .zip address', or upload the file as modpack.zip under Files."; exit 1; }
            cf_need_key "No CurseForge API key. Get a free one at https://console.curseforge.com/ (API Keys), paste it into this server's settings and reinstall. Or skip CurseForge entirely: download the pack's server files yourself and put the .zip address in 'Direct server-pack .zip address', or upload the file as modpack.zip under Files."

            # Accept the page address, the slug on its own, or the numeric id.
            SLUG=$(printf '%s' "$CF_MODPACK" | sed -e 's#^.*/minecraft/modpacks/##' -e 's#[?#].*$##' -e 's#/.*$##' -e 's#^ *##' -e 's# *$##')
            if printf '%s' "$SLUG" | grep -qE '^[0-9]+$'; then
              MODID="$SLUG"
            else
              MODID=$(cfapi "$CF_API/mods/search?gameId=432&classId=4471&slug=$SLUG" | jq -r '.data[0].id // empty')
            fi
            need "$MODID" "CurseForge has no modpack at '$SLUG'. Copy the address out of the browser's address bar on the pack's own page and paste all of it."

            # A pack's Files page address ends in the file id, so someone who
            # pasted one of those has already named a version and should not get
            # the newest instead.
            FID="${CF_FILE_ID:-}"
            if [ -z "$FID" ]; then
              FID=$(printf '%s' "$CF_MODPACK" | sed -n 's#^.*/files/\([0-9][0-9]*\).*$#\1#p')
              if [ -n "$FID" ]; then echo "Using the pack version in the address you pasted (file $FID)"; fi
            fi
            if [ -z "$FID" ]; then
              Q="$CF_API/mods/$MODID/files?pageSize=50&index=0"
              if [ -n "$VER" ] && [ "$VER" != "latest" ]; then Q="$Q&gameVersion=$VER"; fi
              FILES=$(cfapi "$Q")
              # Newest release; fall back to newest of any kind, because plenty of
              # packs live on beta builds for months and "there is no release" is
              # not something to make the admin work out from an empty answer.
              pick() { printf '%s' "$FILES" | jq -r --argjson rt "$1" '[.data[] | select(.isServerPack != true) | select($rt == 0 or .releaseType == $rt)] | sort_by(.fileDate) | reverse | map(.id) | .[0] // empty'; }
              FID=$(pick 1)
              [ -n "$FID" ] || FID=$(pick 0)
            fi
            need "$FID" "That modpack has no files for Minecraft $VER. Leave 'Minecraft version' on latest, or set it to one the pack was built for."

            FJSON=$(cfapi "$CF_API/mods/$MODID/files/$FID")
            # A file either IS the server pack or points at one. Both happen: the
            # id in a pack's download address is usually the client file.
            SPID=$(printf '%s' "$FJSON" | jq -r 'if (.data.isServerPack // false) then (.data.id|tostring) else (.data.serverPackFileId // empty | tostring) end' | grep -v '^$' || true)
            need "$SPID" "That version of the pack has no server files on CurseForge -- only the client download. Pick another version in 'Pack version to install', or download server files yourself and use 'Direct server-pack .zip address'."
            MCV=$(printf '%s' "$FJSON" | jq -r '[.data.gameVersions[]? | select(test("^[0-9]+[.][0-9]"))] | .[0] // empty')

            SPJSON=$(cfapi "$CF_API/mods/$MODID/files/$SPID")
            URL=$(printf '%s' "$SPJSON" | jq -r '.data.downloadUrl // empty')
            [ -n "$URL" ] || URL=$(cfapi "$CF_API/mods/$MODID/files/$SPID/download-url" | jq -r '.data // empty')
            need "$URL" "CurseForge will not hand out a download link for this pack: its author switched third-party downloads off, which no panel can get around. Download the server pack from the pack's Files page yourself, then either paste that .zip address into 'Direct server-pack .zip address' or upload the file as modpack.zip under Files, and reinstall."
            echo "Downloading $(printf '%s' "$SPJSON" | jq -r '.data.fileName // "the server pack"')"
            curl -fsSL -o "$ZIP" "$URL"
            PACK_ID="$MODID-$SPID"
          fi
          [ -s "$ZIP" ] || { echo "the server pack download produced no file"; exit 1; }

          # Changing pack version is the one case where leaving files behind is
          # worse than deleting them: the old version's jars sit in mods/ next to
          # the new ones and the server dies on a duplicate-mod error that names
          # neither the pack nor the update. The world is never in here.
          PREV=$(cat .ygg_cf 2>/dev/null || true)
          if [ -n "$PREV" ] && [ "$PREV" != "$PACK_ID" ]; then
            echo "Pack changed ($PREV -> $PACK_ID): clearing mods/ and libraries/ first. Your world, server.properties, whitelist and ops are kept."
            rm -rf mods libraries
            rm -f .ygg_forge_args
          fi

          rm -rf .ygg_cf_tmp
          mkdir .ygg_cf_tmp
          unzip -q -o "$ZIP" -d .ygg_cf_tmp
          # Some packs zip everything inside one folder and some do not.
          INNER=.ygg_cf_tmp
          if [ "$(find .ygg_cf_tmp -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ]; then
            ONLY=$(find .ygg_cf_tmp -mindepth 1 -maxdepth 1)
            if [ -d "$ONLY" ]; then INNER="$ONLY"; fi
          fi
          # The pack owns the mods and the config. It does not own the world, who
          # is allowed in, or who is an operator -- those belong to this server,
          # and a reinstall to pick up a pack update must not reset them.
          rm -rf "$INNER/world" "$INNER/world_nether" "$INNER/world_the_end"
          rm -f "$INNER/eula.txt" "$INNER/banned-players.json" "$INNER/banned-ips.json"
          if [ -f whitelist.json ]; then rm -f "$INNER/whitelist.json"; fi
          if [ -f ops.json ]; then rm -f "$INNER/ops.json"; fi
          if [ -f server.properties ]; then rm -f "$INNER/server.properties"; fi
          cp -a "$INNER"/. ./
          rm -rf .ygg_cf_tmp "$ZIP"

          # A CurseForge CLIENT export, not a server pack: manifest.json naming
          # the loader and every mod by id, modlist.html, and an overrides/ folder.
          # It contains no mods and no server -- the launcher fetches them -- and
          # it is what somebody sends you when they built the pack themselves, so
          # it arrives at least as often as a published server pack does. Without
          # this the unpack produces three files and a folder, no loader, no jars,
          # and an error listing them, which is accurate and no help at all.
          if [ -f manifest.json ] && [ "$(jq -r '.manifestType // empty' manifest.json)" = "minecraftModpack" ]; then
            PACKNAME=$(jq -r '.name // "this pack"' manifest.json)
            MCV=$(jq -r '.minecraft.version // empty' manifest.json)
            # The primary loader, falling back to the first when none is flagged.
            LOADER_ID=$(jq -r '[.minecraft.modLoaders[]? | select(.primary == true)] + [.minecraft.modLoaders[]?] | map(.id) | .[0] // empty' manifest.json)
            need "$MCV" "manifest.json does not say which Minecraft version this pack is for"
            need "$LOADER_ID" "manifest.json does not name a mod loader"
            echo "CurseForge client pack \"$PACKNAME\" - Minecraft $MCV, $LOADER_ID"

            # Before the loader, not after: installing one takes a minute, and
            # without a key this pack cannot be finished whatever happens next.
            # An error that arrives first is the same error, for free.
            cf_need_key "This is a CurseForge client pack: it lists its mods by id instead of containing them, so every one has to be fetched from CurseForge, and that needs an API key. Get a free one at https://console.curseforge.com/ (API Keys) and paste it into this server's settings. There is no way around the key for this kind of pack -- the files are not in the zip."

            # The manifest names the exact loader build, so nothing is resolved
            # here: no "latest", no promotions file, no guessing.
            case "$LOADER_ID" in
              neoforge-*)
                NF=${LOADER_ID#neoforge-}
                echo "Installing NeoForge $NF (this takes a minute)"
                curl -fsSL -o neoforge-installer.jar \
                  "https://maven.neoforged.net/releases/net/neoforged/neoforge/$NF/neoforge-$NF-installer.jar"
                java -jar neoforge-installer.jar --installServer
                rm -f neoforge-installer.jar neoforge-installer.jar.log
                LOADER=neoforge
                ;;
              forge-*)
                FV=${LOADER_ID#forge-}
                # A manifest writes forge as either "forge-47.2.0" or the full
                # "forge-1.20.1-47.2.0"; maven only knows the full form.
                case "$FV" in "$MCV-"*) FULL="$FV" ;; *) FULL="$MCV-$FV" ;; esac
                echo "Installing Forge $FULL (this takes a minute)"
                curl -fsSL -o forge-installer.jar \
                  "https://maven.minecraftforge.net/net/minecraftforge/forge/$FULL/forge-$FULL-installer.jar"
                java -jar forge-installer.jar --installServer
                rm -f forge-installer.jar forge-installer.jar.log
                LOADER=forge
                ;;
              fabric-*)
                FL=${LOADER_ID#fabric-}
                FI=$(curl -fsSL https://meta.fabricmc.net/v2/versions/installer | jq -r '.[0].version')
                need "$FI" "could not reach the Fabric installer index"
                curl -fsSL -o server.jar \
                  "https://meta.fabricmc.net/v2/versions/loader/$MCV/$FL/$FI/server/jar"
                LOADER=fabric
                ;;
              *)
                echo "This pack wants the loader \"$LOADER_ID\", which this rune cannot install. Forge, NeoForge and Fabric are supported."
                exit 1 ;;
            esac

            # overrides/ is the pack's own config, scripts and resources. It goes
            # in before the mods so a mod's first start reads the pack's config
            # rather than writing its own defaults.
            if [ -d overrides ]; then
              cp -a overrides/. ./
              rm -rf overrides
            fi

            mkdir -p mods resourcepacks shaderpacks
            jq -r '.files[]? | "\(.projectID) \(.fileID)"' manifest.json > .ygg_cf_files
            TOTAL=$(wc -l < .ygg_cf_files | tr -d ' ')
            echo "Fetching $TOTAL files from CurseForge"
            GOT=0; SKIPPED=0; MISSING=""
            # Redirected, not piped: a `while read` on the right-hand side of a
            # pipe runs in a subshell under sh, and every count below would be
            # lost at the end of the loop while the loop itself looked fine.
            while read -r PID FID2; do
              [ -n "$PID" ] || continue
              FJ=$(cfapi "$CF_API/mods/$PID/files/$FID2")
              URL=$(printf '%s' "$FJ" | jq -r '.data.downloadUrl // empty')
              [ -n "$URL" ] || URL=$(cfapi "$CF_API/mods/$PID/files/$FID2/download-url" | jq -r '.data // empty')
              FNAME=$(printf '%s' "$FJ" | jq -r '.data.fileName // empty')
              [ -n "$FNAME" ] || FNAME=$(printf '%s' "$URL" | sed 's#.*/##' | sed 's#?.*##')
              if [ -z "$URL" ]; then
                MISSING="$MISSING\n  - project $PID file $FID2${FNAME:+ ($FNAME)}"
                continue
              fi
              # A pack lists resource packs and shaders alongside its mods, and
              # CurseForge says which is which (classId 6 = mod, 12 = resource
              # pack, 6552 = shader). Loading a resource pack as a mod is a crash
              # on start, so put each where it belongs rather than in mods/.
              CLASS=$(cfapi "$CF_API/mods/$PID" | jq -r '.data.classId // empty')
              case "$CLASS" in
                12)   DESTDIR=resourcepacks ;;
                6552) DESTDIR=shaderpacks ;;
                *)    DESTDIR=mods ;;
              esac
              if curl -fsSL -o "$DESTDIR/$FNAME" "$URL"; then
                GOT=$((GOT+1))
                [ "$DESTDIR" = mods ] || SKIPPED=$((SKIPPED+1))
              else
                MISSING="$MISSING\n  - $FNAME (download failed)"
              fi
            done < .ygg_cf_files
            rm -f .ygg_cf_files manifest.json modlist.html

            echo "Installed $GOT of $TOTAL files ($((GOT-SKIPPED)) mods, $SKIPPED resource/shader packs)."
            if [ -n "$MISSING" ]; then
              # Not fatal: a pack of forty mods where two authors disallow
              # third-party downloads should still produce a server, with the two
              # named so they can be dropped into mods/ by hand.
              printf 'CurseForge would not hand out these, so they are NOT installed:%b\n' "$MISSING"
              echo "Download each from its CurseForge page and upload it into mods/ under Files."
            fi
            # Said plainly because nothing can detect it: a NeoForge mod does not
            # declare which side it belongs on. Measured on Sodium 0.8.13, the
            # most client-only mod there is -- its own neoforge.mods.toml has no
            # side field at all, only side="CLIENT" on its dependencies. So a
            # client pack's rendering mods come across with everything else.
            echo "Note: this was a client pack, so it may include mods that only work on a client (a rendering mod such as Sodium, a minimap). Nothing in a mod's own metadata says which, so they are installed with the rest. If the server dies on its first start, the crash names the mod -- delete it under Files in mods/ and start again."
          fi

          # How does this thing start? Most definite answer first.
          find_args() {
            for p in libraries/net/neoforged/neoforge/*/unix_args.txt \
                     libraries/net/minecraftforge/forge/*/unix_args.txt; do
              if [ -f "$p" ]; then printf '%s\n' "$p" > .ygg_forge_args; return 0; fi
            done
            return 1
          }
          if ! find_args; then
            # head picks one candidate here; it is not counting anything.
            INST=$(find . -maxdepth 1 -name '*nstaller*.jar' | head -n1)
            if [ -n "$INST" ]; then
              echo "Pack ships a loader installer ($INST) - running it, this takes a minute"
              java -jar "$INST" --installServer
              rm -f "$INST" "$INST.log"
              find_args || true
            fi
          fi
          if [ ! -s .ygg_forge_args ] && [ -f server-setup-config.yaml ]; then
            SS=$(find . -maxdepth 1 -name 'serverstarter*.jar' | head -n1)
            if [ -n "$SS" ]; then
              echo "Pack ships the ServerStarter bootstrapper - running it once to fetch the loader and the mods"
              java -jar "$SS" || true
              find_args || true
            fi
          fi
          if [ ! -s .ygg_forge_args ] && [ ! -s server.jar ]; then
            for cand in fabric-server-launch.jar quilt-server-launch.jar \
                        neoforge-*.jar forge-*.jar fabric-server-*.jar \
                        minecraft_server*.jar; do
              case "$cand" in *nstaller*) continue ;; esac
              if [ -s "$cand" ]; then cp "$cand" server.jar; echo "Launching from $cand"; break; fi
            done
          fi
          if [ ! -s .ygg_forge_args ] && [ ! -s server.jar ]; then
            echo "Could not work out how to start this pack. The zip contained:"
            find . -maxdepth 1 -not -name '.*' -not -name modpack.zip | sed 's#^./##' | sort
            echo "If one of those is the server jar, rename a copy of it to server.jar under Files and start the server."
            exit 1
          fi

          # Record the loader, because SERVER_TYPE now says "curseforge", which
          # names a shop rather than a mod loader -- the Mods tab, the mod checker
          # and Kvasir all read this file to answer what the server can load.
          LOADER=""
          if [ -s .ygg_forge_args ]; then
            case "$(cat .ygg_forge_args)" in
              */neoforged/*) LOADER=neoforge ;;
              *) LOADER=forge ;;
            esac
          elif [ -f fabric-server-launch.jar ] || [ -f fabric-server-launcher.properties ] || [ -d .fabric ]; then
            LOADER=fabric
          elif [ -d libraries/net/neoforged ]; then
            LOADER=neoforge
          elif [ -d libraries/net/minecraftforge ]; then
            LOADER=forge
          fi
          if [ -z "$MCV" ]; then
            MCV=$(ls minecraft_server.*.jar 2>/dev/null | sed -n 's#^minecraft_server[.]\(.*\)[.]jar$#\1#p' | head -n1)
          fi
          if [ -z "$MCV" ] && [ -d libraries/net/minecraft/server ]; then
            MCV=$(find libraries/net/minecraft/server -mindepth 1 -maxdepth 1 -type d \
                  | sed -e 's#^.*/##' -e 's#-.*$##' \
                  | grep -E '^[0-9]+[.][0-9]' | sort -u | head -n1)
          fi
          if [ -z "$MCV" ] && [ -s .ygg_forge_args ]; then
            # Forge's library path carries the Minecraft version; NeoForge's does
            # not, so this answers for one of the two and stays blank for the other.
            MCV=$(sed -n 's#.*/forge/\([0-9][^-]*\)-.*#\1#p' .ygg_forge_args | head -n1)
          fi
          printf '%s %s\n' "${LOADER:-unknown}" "${MCV:-unknown}" > .ygg_loader

          # The Java a pack needs is decided by its Minecraft version, and the
          # image is already chosen by the time this runs -- so this can only say
          # so. Getting it wrong is a crash on the first start whose message
          # ("UnsupportedClassVersionError", or nothing at all) names no setting.
          if [ -n "$MCV" ]; then
            case "$MCV" in
              1.[0-9].*|1.[0-9]|1.1[0-6]*) WANT=8;  MAXOK=11 ;;
              1.17*)                       WANT=17; MAXOK=21 ;;
              1.18*|1.19*|1.20|1.20.[1-4]*) WANT=17; MAXOK=21 ;;
              *)                           WANT=21; MAXOK=25 ;;
            esac
            if [ "${JAVA_VERSION:-0}" -lt "$WANT" ] || [ "${JAVA_VERSION:-0}" -gt "$MAXOK" ]; then
              echo ""
              echo "NOTE: this pack is Minecraft $MCV, which wants Java $WANT (up to $MAXOK), and this server is set to Java ${JAVA_VERSION:-?}."
              echo "      Set 'Java runtime' to $WANT in Settings and restart, or it will almost certainly fail to start."
              echo ""
            fi
          fi
          printf '%s\n' "$PACK_ID" > .ygg_cf
          VER="${MCV:-unknown}"
          BUILD="$PACK_ID"
          echo "Installed CurseForge pack $PACK_ID - ${LOADER:-unknown}, Minecraft ${MCV:-unknown}"
          ;;
        *)
          echo "unknown SERVER_TYPE: $TYPE"; exit 1 ;;
      esac

      # Make sure the install actually produced something runnable. Forge is the
      # exception with no server.jar at all - its marker is checked above.
      if [ ! -s .ygg_forge_args ]; then
        [ -s server.jar ] || { echo "download produced no server.jar"; exit 1; }
      fi

      # Record what we installed so the panel can tell when a newer build exists
      # (the jar-update check reads this: "<type> <version> <build>").
      echo "$TYPE $VER $BUILD" > .ygg_jar

      echo "eula={{EULA}}" > eula.txt

      # Append a trailing newline first if the file lacks one, so we never merge
      # onto the last existing line (e.g. a hand-edited server.properties).
      # Append a trailing newline only if the file exists and lacks one. Must
      # return 0 even when the file is absent (fresh install) — otherwise `set -e`
      # would abort the whole install.
      ensure_nl() { if [ -s server.properties ] && [ -n "$(tail -c1 server.properties)" ]; then echo >> server.properties; fi; }
      # Pre-seed RCON + whitelist settings so the panel (and schedules/bans) can
      # connect. Minecraft fills in any remaining server.properties on first run.
      if ! grep -q '^enable-rcon=' server.properties 2>/dev/null; then
        ensure_nl
        {
          echo "enable-rcon=true"
          echo "rcon.port={{RCON_PORT}}"
          echo "rcon.password={{RCON_PASSWORD}}"
          echo "white-list={{ENABLE_WHITELIST}}"
          echo "enforce-whitelist={{ENABLE_WHITELIST}}"
          echo "difficulty={{DIFFICULTY}}"
          # World type is fixed at generation — only meaningful on the first run.
          echo "level-type=minecraft:{{LEVEL_TYPE}}"
        } >> server.properties
      fi
      # World seed (only on first install, before the world is generated).
      if [ -n "{{LEVEL_SEED}}" ] && ! grep -q '^level-seed=' server.properties 2>/dev/null; then
        ensure_nl
        echo "level-seed={{LEVEL_SEED}}" >> server.properties
      fi
      # Ensure the whitelist/ops files exist so they're editable in the file manager.
      [ -f whitelist.json ] || echo "[]" > whitelist.json
      [ -f ops.json ] || echo "[]" > ops.json

      # Paper and Purpur split the Nether and the End into world_nether/ and
      # world_the_end/ the first time they start; vanilla, Fabric and Forge read
      # them from inside world/ as DIM-1 and DIM1. So changing a server between
      # those two families leaves the other dimensions looking freshly generated,
      # while the old ones sit intact under the layout nobody is reading. Say so
      # here rather than let it be discovered by walking through a portal.
      case "$TYPE" in
        paper|purpur) ;;
        *)
          if [ -d world_nether ] || [ -d world_the_end ]; then
            echo "NOTE: world_nether/ and world_the_end/ are the Paper layout. $TYPE reads the Nether and End from world/DIM-1 and world/DIM1, so they will look newly generated until those folders are moved (world_nether/DIM-1 -> world/DIM-1, world_the_end/DIM1 -> world/DIM1)."
          fi ;;
      esac

      if [ -s .ygg_forge_args ]; then
        echo "Installed $TYPE $VER build $BUILD -> $(cat .ygg_forge_args)"
        echo "Put Forge mods in mods/ - the Mods tab manages that folder for this server type."
      else
        echo "Installed $TYPE $VER -> server.jar"
        ls -la server.jar
      fi

  startup:
    # Re-stamp eula.txt + the mutable server.properties toggles (difficulty,
    # whitelist) from the CURRENT settings on every start, so changing them in
    # Settings + restart actually takes effect — install only writes them once,
    # and the toggle otherwise looks applied while the server keeps the old value.
    # World type is omitted — it's fixed at world generation and can't change.
    # `exec` hands PID 1 + stdin to Java so the "stop" command and signals reach it.
    # --enable-native-access=ALL-UNNAMED silences the Java 24+ "restricted
    # method ... java.lang.System::load (JNA)" warnings; harmless either way.
    command: |
      # Rewrite the line rather than sed it in place: a value with a / or an & in
      # it (an RCON password is the one that gets typed by hand) is a replacement
      # expression to sed, not a string, and the server then starts with a
      # password nobody has.
      setprop() { if [ -f server.properties ]; then grep -v "^$1=" server.properties > .ygg_props.tmp || true; else : > .ygg_props.tmp; fi; printf '%s=%s\n' "$1" "$2" >> .ygg_props.tmp; mv .ygg_props.tmp server.properties; }
      echo eula={{EULA}} > eula.txt
      setprop difficulty {{DIFFICULTY}}
      # Hardcore belongs with the re-stamped settings, not the install-only ones:
      # it can be turned on and off on an existing world, and Minecraft ignores
      # the difficulty line while it is on.
      setprop hardcore {{HARDCORE}}
      setprop white-list {{ENABLE_WHITELIST}}
      setprop enforce-whitelist {{ENABLE_WHITELIST}}
      # RCON is re-stamped for the same reason as the rest: install writes these
      # once, so changing the password in Settings did nothing and the panel went
      # on using a password the server had never been told. A modpack makes it
      # worse -- a CurseForge pack ships its own server.properties with
      # enable-rcon=false, which install leaves alone, so the console, the player
      # list and scheduled commands would all be dead on arrival.
      setprop enable-rcon true
      setprop rcon.port "$RCON_PORT"
      setprop rcon.password "$RCON_PASSWORD"
      # --enable-native-access=ALL-UNNAMED silences the Java 24+ "restricted
      # method ... java.lang.System::load (JNA)" warnings. It is not merely
      # ignored by an older JVM: Java 8 and 11 refuse to start on an option they
      # do not know, and those are exactly the runtimes old modpacks need. Ask
      # the JVM in front of us instead of inferring it from the setting.
      NATIVE=""
      java --enable-native-access=ALL-UNNAMED -version >/dev/null 2>&1 && NATIVE=--enable-native-access=ALL-UNNAMED
      # Forge and NeoForge (1.17+) have no runnable jar: they are launched from
      # the @argfile the installer wrote, whose path the install step recorded --
      # including when the installer came inside a CurseForge server pack.
      # Everything else is a plain -jar server.jar. user_jvm_args.txt is
      # deliberately skipped - it ships fully commented out and -Xmx is set here.
      if [ -s .ygg_forge_args ]; then
        exec java -Xmx{{MEMORY_MB}}M $NATIVE "@$(cat .ygg_forge_args)" nogui
      fi
      exec java -Xmx{{MEMORY_MB}}M $NATIVE -jar server.jar nogui
    done_regex: 'Done \(.*\)! For help'
    # Flush chunks to disk before shutting down, then stop cleanly (the "stop"
    # command already saves, but save-all first makes a graceful restart robust).
    save_command: "save-all"
    stop: "stop"

  query:
    type: minecraft

  rcon:
    enabled: true
    type: minecraft
    password_var: RCON_PASSWORD

  config_files:
    - "server.properties"
    - "whitelist.json"
    - "ops.json"
    - "config/paper-world-defaults.yml"

  ports:
    - { name: game, default: 25565, protocol: tcp }
    - { name: rcon, default: 25575, protocol: tcp }

  anticheat:
    antixray:
      supported: true
      config_hint: "Paper anti-xray (engine-mode 1/2) in config/paper-world-defaults.yml"
    plugins_recommended: ["Grim", "Vulcan", "NoCheatPlus"]

  bans:
    ban_command: "ban {{player}} {{reason}}"
    unban_command: "pardon {{player}}"

  backup:
    include: ["world", "world_nether", "world_the_end", "server.properties", "whitelist.json", "ops.json", "plugins"]

  # "Wipe" deletes the world folders; a fresh world regenerates on next start
  # (same seed if level-seed is set, otherwise random). Keeps server.properties,
  # whitelist and ops.
  wipe:
    paths: ["world", "world_nether", "world_the_end"]
    backup_first: true

  # In-game countdown broadcast before a safe restart.
  restart:
    warnings:
      - { at: "15m", msg: "say ⚠ Server restart in 15 minutes." }
      - { at: "5m",  msg: "say ⚠ Server restart in 5 minutes." }
      - { at: "1m",  msg: "say ⚠ Restarting in 1 minute — find a safe spot!" }

  # Default Kvasir watchers — seeded per server as editable rules.
  watchers:
    - name: "Server can't keep up (lag)"
      pattern: "Can't keep up!"
      threshold: 3
      window_secs: 300
      action: kvasir
    - name: "Out of memory"
      pattern: "java\\.lang\\.OutOfMemoryError"
      threshold: 1
      window_secs: 300
      action: kvasir
    # The two ways a modpack fails to start, both of which otherwise arrive as a
    # thirty-line stack trace whose answer is one mod's name.
    #
    # LWJGL is the client's windowing and graphics library and is not on a server
    # at all, so this message always means exactly one thing: a client-only mod is
    # sitting in mods/. Nothing in a NeoForge mod's own metadata says which side
    # it belongs on -- measured on Sodium 0.8.13, whose neoforge.mods.toml has no
    # side field -- so it cannot be prevented at install time, only recognised
    # here. Seen on a real pack 2026-10-07: it cost two start attempts.
    - name: "A client-only mod is in mods/ — remove it and start again"
      pattern: "NoClassDefFoundError: org/lwjgl"
      threshold: 1
      window_secs: 300
      action: kvasir
    - name: "A mod is missing something it depends on"
      pattern: "Missing or unsupported mandatory dependencies"
      threshold: 1
      window_secs: 300
      action: kvasir
