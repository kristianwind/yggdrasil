gameskill:
  id: jackett
  name: "Jackett"
  category: "Apps"
  description: "Proxy server that translates queries from apps like Sonarr and Radarr into tracker-site searches, giving them a unified indexer API. Part of the *arr media stack."
  author: "yggdrasil-community"
  version: 1
  icon: "app"

  # LinuxServer image: starts as root, drops to PUID:PGID so it can write the
  # panel-owned data dir. Config + SQLite live in /config.
  docker:
    image: "lscr.io/linuxserver/jackett:latest"
    data_path: /config
    keep_entrypoint: true
    user: "0:0"

  variables:
    - key: PUID
      name: "Run-as UID (must own the data dir)"
      type: int
      default: 999
    - key: PGID
      name: "Run-as GID"
      type: int
      default: 982
    - key: TZ
      name: "Timezone"
      type: string
      default: "Europe/Copenhagen"

  install:
    image: "busybox:latest"
    script: |
      mkdir -p /data
      echo "Jackett config directory ready"

  startup:
    command: ""
    done_regex: '\[ls\.io-init\] done\.'

  ports:
    - { name: web, default: 9117, protocol: tcp }

  # Jackett only proxies tracker searches — it needs no media or download mounts.
  backup:
    include: ["."]
