gameskill:
  id: jellyseerr
  name: "Jellyseerr"
  category: "Apps"
  description: "Request-management and media-discovery for Jellyfin, Plex and Emby — the actively maintained fork of Overseerr. Users request movies/TV; it hands them to Sonarr/Radarr."
  author: "yggdrasil-community"
  version: 1
  icon: "app"

  docker:
    image: "fallenbagel/jellyseerr:latest"
    # Config + its SQLite database live in /app/config. Run as root so the app can
    # write the panel-owned data dir (the image has no PUID/PGID knobs).
    data_path: /app/config
    keep_entrypoint: true
    user: "0:0"

  variables:
    - key: TZ
      name: "Timezone"
      type: string
      default: "Europe/Copenhagen"
    - key: LOG_LEVEL
      name: "Log level (debug, info, warn, error)"
      type: string
      default: "info"

  install:
    image: "busybox:latest"
    script: |
      mkdir -p /data
      echo "Jellyseerr config directory ready"

  startup:
    command: ""
    done_regex: 'Server ready'

  ports:
    - { name: web, default: 5055, protocol: tcp }

  # Point Jellyseerr at your Jellyfin/Plex server and your Sonarr/Radarr from its
  # own web UI on first-run setup. No host mounts needed — it stores only its config.
  backup:
    include: ["."]
