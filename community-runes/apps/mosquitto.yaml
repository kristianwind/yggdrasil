gameskill:
  id: mosquitto
  name: "Mosquitto (MQTT)"
  category: "Apps"
  description: "Eclipse Mosquitto — a lightweight MQTT broker for home automation and IoT, so your sensors and Home Assistant talk to each other on your own hardware instead of a vendor's cloud."
  author: "yggdrasil-community"
  version: 1
  icon: "app"

  docker:
    image: "eclipse-mosquitto:latest"
    # Persistence lives here. The image's own /mosquitto/config is NOT mounted on
    # purpose: mounting it would hide the config baked into the image and leave the
    # broker with nothing to read. The config this rune generates is written into
    # the persisted data dir instead, and mosquitto is pointed at it below.
    data_path: /mosquitto/data
    keep_entrypoint: true
    # Must start as root: the image's /docker-entrypoint.sh only chowns
    # /mosquitto/data to PUID:PGID when it is running as uid 0. Without this the
    # broker (uid 1883) cannot write to the panel-owned data dir, and persistence
    # silently fails.
    user: "0:0"

  variables:
    - key: PUID
      name: "Run-as UID"
      type: int
      default: 1883
    - key: PGID
      name: "Run-as GID"
      type: int
      default: 1883
    - key: TZ
      name: "Timezone"
      type: string
      default: "Europe/Copenhagen"
    - key: MQTT_USERNAME
      name: "Username (leave empty to allow anonymous clients)"
      type: string
      default: ""
    - key: MQTT_PASSWORD
      name: "Password (only used when a username is set)"
      type: string
      default: ""
      secret: true
    - key: PERSISTENCE
      name: "Keep messages across restarts"
      type: bool
      default: true

  install:
    image: "eclipse-mosquitto:latest"
    # Writes the broker config into the persisted data dir (mounted at /data during
    # install). Done here rather than at every start so an admin can edit the file
    # afterwards from the Files tab and keep their changes.
    script: |
      set -e
      if [ -f /data/mosquitto.conf ]; then
        echo "mosquitto.conf already exists — leaving it alone"
      else
        {
          echo "# Generated by Yggdrasil on first install. Safe to edit."
          echo "listener 1883"
          if [ -n "$MQTT_USERNAME" ] && [ -n "$MQTT_PASSWORD" ]; then
            echo "allow_anonymous false"
            echo "password_file /mosquitto/data/passwd"
          else
            echo "allow_anonymous true"
          fi
          if [ "$PERSISTENCE" = "true" ]; then
            echo "persistence true"
            echo "persistence_location /mosquitto/data/"
          fi
          echo "log_dest stdout"
        } > /data/mosquitto.conf
        echo "wrote /data/mosquitto.conf"
      fi
      # A password file is only meaningful when both fields are filled in.
      if [ -n "$MQTT_USERNAME" ] && [ -n "$MQTT_PASSWORD" ]; then
        touch /data/passwd
        mosquitto_passwd -b /data/passwd "$MQTT_USERNAME" "$MQTT_PASSWORD"
        chmod 600 /data/passwd
        echo "password file created for user $MQTT_USERNAME"
      else
        echo "NOTE: no username/password set — this broker accepts ANONYMOUS clients."
      fi

  startup:
    # keep_entrypoint sends these as arguments to /docker-entrypoint.sh, which
    # chowns the data dir and then execs them. Same shape as the image's own CMD,
    # but pointed at the generated config in the persisted directory.
    exec: ["/usr/sbin/mosquitto", "-c", "/mosquitto/data/mosquitto.conf"]
    # Verified against eclipse-mosquitto 2.1.2: the broker logs "... starting" long
    # before it can accept anything, and "... running" only once the listeners are
    # open. Matching "starting" would report ready too early.
    done_regex: 'mosquitto version .* running'
    stop_timeout: 10

  ports:
    - name: mqtt
      default: 1883
      protocol: tcp

  config_files:
    - mosquitto.conf

  backup:
    paths: ["."]

  watchers:
    - name: "Auth failures"
      pattern: 'Client .* disconnected, not authorised|Socket error on client .*, disconnecting'
      threshold: 10
      window_secs: 120
      action: kvasir
    - name: "Broker restart loop"
      pattern: 'mosquitto version .* starting'
      threshold: 3
      window_secs: 300
      action: notify

  events:
    - key: mqtt_auth_failure
      # Capture group 1 is the client id mosquitto reports on a rejected connection.
      match: 'Client ([^ ]+) disconnected, not authorised'
      label: "MQTT auth failure"
