gameskill:
  id: php-site
  name: "PHP site (Apache)"
  category: "Apps"
  description: >
    Host a website that includes PHP — a contact form, a small script, a
    hand-built site — with Apache and PHP 8.3. The server's file area IS the web
    root: upload from the Files tab and it is served immediately. Give it a
    Subdomain to publish it.

    Use this instead of "Static site" whenever the site contains .php files. A
    static-site server has no PHP interpreter, so it does not run them — it
    SERVES them, as plain text, to anyone who asks. A site can look perfectly
    normal while handing out whatever its scripts contain, which on a real site
    has meant SMTP credentials.
  author: "yggdrasil-community"
  version: 3
  icon: "app"

  # php:8.3-apache is Apache with mod_php in one container, so there is no
  # php-fpm sidecar to wire up and nothing to keep in sync — the whole point of
  # this rune is that "my site has a PHP file in it" should not require an
  # app stack. It serves static files exactly as nginx did.
  #
  # user 0:0 so the Apache master can bind :80 and read the panel-owned files;
  # keep_entrypoint runs the image's own entrypoint, which configures Apache
  # before handing over.
  docker:
    image: "php:8.3-apache"
    keep_entrypoint: true
    user: "0:0"
    data_path: /var/www/html

  # Optional mail settings. A PHP site is usually a site with a contact form, and
  # the form needs an SMTP account — which is how those credentials end up written
  # into the .php file itself, where a missing interpreter (see above) hands them
  # out. Setting them here instead keeps them out of the web root entirely: the
  # panel encrypts the password at rest and passes all five to the container as
  # environment variables, so the script reads getenv('SMTP_PASS') and contains no
  # secret to leak. Leave them empty if the site sends no mail.
  variables:
    - { key: SMTP_HOST, name: "SMTP host", type: string, default: "" }
    - { key: SMTP_PORT, name: "SMTP port", type: string, default: "587" }
    - { key: SMTP_USER, name: "SMTP username", type: string, default: "" }
    - { key: SMTP_PASS, name: "SMTP password", type: string, default: "", secret: true }
    - { key: MAIL_TO, name: "Send form mail to", type: string, default: "" }

  install:
    image: "busybox:latest"
    script: |
      if [ ! -f /data/index.php ] && [ ! -f /data/index.html ]; then
        cat > /data/index.html <<'HTML'
        <!doctype html><html lang="en"><meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>It works</title>
        <body style="font-family:system-ui;max-width:40rem;margin:4rem auto;padding:0 1rem">
        <h1>Your PHP site is running</h1>
        <p>Replace this file from the panel's <strong>Files</strong> tab. Both
        <code>.html</code> and <code>.php</code> files are served from here.</p>
        HTML
        echo "Placeholder page written."
      else
        echo "Existing site found — left untouched."
      fi

  startup:
    # php:8.3-apache ships no php.ini at all, and PHP's compiled-in default is
    # display_errors=On. A site served that way answers a broken request with the
    # error text — file paths, SQL, the line that failed — and a notice printed
    # before a header('Location: …') breaks the redirect outright, so the failure
    # is not even quiet. Write the production defaults before Apache starts and
    # send errors to stderr, where the panel's console and log watchers see them
    # instead of the visitor.
    #
    # The second half is about who the visitor is. Behind a proxy — which every
    # published site here is — Apache logs the proxy's address, so every request
    # looks identical and every IP-based signal the panel has is worthless: the
    # access log reads 172.17.0.1 for the whole internet. On a site being scanned
    # that is not a cosmetic problem. mod_remoteip restores the real client from
    # X-Forwarded-For, which is what the official WordPress image already does —
    # this is that same configuration, and why WordPress servers here report real
    # addresses while php-site ones reported the Docker bridge.
    #
    # InternalProxy lists only private ranges, so the header is trusted solely
    # when the request arrives from one. A request straight from the internet
    # keeps its real peer address and cannot spoof itself a different one.
    #
    # exec keeps apache2-foreground as PID 1 so a stop signal still reaches it.
    command: |
      printf '%s\n' 'display_errors = Off' 'log_errors = On' 'error_log = /dev/stderr' 'expose_php = Off' \
        > /usr/local/etc/php/conf.d/zz-yggdrasil-prod.ini
      printf '%s\n' 'RemoteIPHeader X-Forwarded-For' \
        'RemoteIPInternalProxy 10.0.0.0/8' \
        'RemoteIPInternalProxy 172.16.0.0/12' \
        'RemoteIPInternalProxy 192.168.0.0/16' \
        'RemoteIPInternalProxy 169.254.0.0/16' \
        > /etc/apache2/conf-available/remoteip.conf
      a2enmod -q remoteip && a2enconf -q remoteip
      exec apache2-foreground
    # Apache reports readiness on its own line; the panel also treats a
    # connectable web port as ready, so a wording change upstream cannot strand
    # the server in "starting".
    done_regex: 'resuming normal operations|Command line'

  ports:
    - { name: web, default: 80, protocol: tcp }

  backup:
    include: ["."]

  # The failure this rune exists to prevent, watched for directly: a PHP file
  # being handed out as text means something is serving this content without an
  # interpreter, and whatever those files contain is public.
  watchers:
    - name: "PHP source served as text"
      pattern: '"(GET|HEAD)[^"]*\.php[^"]*" 200 [0-9]+ .*(octet-stream|text/plain)'
      threshold: 1
      window_secs: 300
      action: kvasir
