gameskill:
  id: plex
  name: "Plex Media Server"
  category: "Apps"
  description: "Organise and stream your movies, TV, music and photos to any device with the Plex apps. Point it at your media library (added as an admin host mount) and Plex catalogs it with artwork and metadata. Remote streaming works through Plex's relay, so publishing the single web port is enough for most setups. Sign in and claim the server on first run with a short-lived claim token from plex.tv/claim."
  author: "yggdrasil-community"
  version: 1
  icon: "app"

  # LinuxServer image: starts as root, drops to PUID:PGID so it can write the
  # panel-owned data dir. The library database + metadata live in /config.
  docker:
    image: "lscr.io/linuxserver/plex:latest"
    data_path: /config
    keep_entrypoint: true
    user: "0:0"

  variables:
    - key: PUID
      name: "Run-as UID (must own the data dir)"
      type: int
      default: 999
    - key: PGID
      name: "Run-as GID"
      type: int
      default: 982
    - key: TZ
      name: "Timezone"
      type: string
      default: "Europe/Copenhagen"
    - key: VERSION
      name: "Update channel (docker = latest stable)"
      type: string
      default: "docker"
    - key: PLEX_CLAIM
      name: "Claim token (optional — get one from plex.tv/claim, valid ~4 min)"
      type: string
      default: ""

  install:
    image: "busybox:latest"
    script: |
      mkdir -p /data
      echo "Plex config directory ready"

  startup:
    command: ""
    done_regex: '\[ls\.io-init\] done\.'

  ports:
    - { name: web, default: 32400, protocol: tcp }

  # Your media lives OUTSIDE this data dir. As an admin, open this server's
  # Settings → "Host mounts" and add your libraries, e.g.:
  #   /mnt/media/movies → /media/movies
  #   /mnt/media/tv     → /media/tv
  # Host mounts are admin-only and per server — never in the rune.
  backup:
    include: ["."]
