gameskill:
  id: tracefinity
  name: "Tracefinity"
  category: "Apps"
  description: >
    Photograph your tools and get printable Gridfinity bins shaped to them. You
    upload a picture of a drawer or a handful of tools, it traces each outline,
    and you download the models to print.

    Bring a Google Gemini API key if you want it to do the tracing for you —
    it can also be typed in the web interface instead, so the key never has to
    live on the server. Everything it produces is kept in the server's file
    area.
  author: "yggdrasil-community"
  version: 6
  icon: "app"

  # One container, one volume, no database — the project's own compose file is
  # three lines, and this rune is that with the panel's plumbing attached.
  #
  # keep_entrypoint AND user 0:0 together, exactly as the LinuxServer runes do —
  # and the pairing is load-bearing, not decoration. The panel writes a minimal
  # /etc/passwd into the container when a user is forced, so that getpwuid()
  # succeeds for game servers that call it; it skips that only when the rune
  # keeps the image's entrypoint. Setting user without keep_entrypoint therefore
  # replaces the passwd file and deletes the image's own `tracefinity` account,
  # and its entrypoint dies on `id -u tracefinity: no such user` before anything
  # starts. v1 of this rune did exactly that.
  #
  # The image starts as root, remaps its account to PUID:PGID and drops to it.
  #
  # :latest rather than the newest version tag. 0.4.0 — the most recent numbered
  # release — predates the project's rootless work and ships NO entrypoint at
  # all: it runs supervisord straight as root, so everything it writes into the
  # server's data directory ends up owned by root and the panel can no longer
  # manage its own files. :latest is a distinct digest from :dev, so this is the
  # release channel and not a development build.
  docker:
    image: "ghcr.io/tracefinity/tracefinity:latest"
    keep_entrypoint: true
    user: "0:0"
    data_path: /app/storage

  variables:
    # ── Who it runs as ────────────────────────────────────────────────────────
    # Same shape as the LinuxServer runes here. The image chowns its storage to
    # PUID:PGID, and that storage IS the panel's data directory for this server —
    # so a wrong value hands the server's files to a uid the panel isn't, and the
    # Files tab, backups and restores all stop working. The defaults are this
    # fleet's service account; the panel creates it with `useradd --system`, so
    # the number is whatever the OS had free (999 on two boxes here, 996 on a
    # third). Check with `id yggdrasil` if this install is not one of those.
    - key: PUID
      name: "Run-as UID (must own the data dir)"
      type: int
      default: 999
    - key: PGID
      name: "Run-as GID"
      type: int
      default: 982

    # ── Tracing: what draws the outlines ──────────────────────────────────────
    # Leave empty and it picks for itself: a key below selects that service,
    # otherwise it runs the local models. Nothing here is required — the default
    # local tracer needs no account anywhere and no GPU, only AVX.
    #
    # RAM is in the labels because it is the deciding factor and the failure is
    # not obvious: the tracer and the paper-detection model are both resident for
    # the life of the container, so an under-provisioned box gets an OOM kill
    # mid-trace rather than a message saying the model was too big.
    # 🔴 Leaving this blank is not neutral. On blank the app picks for itself,
    # and the FIRST thing it looks at is whether any remote key is filled in —
    # including the OpenRouter key further down, which is there for naming
    # tools, a completely different job. Fill that in to name tools on your own
    # server and tracing silently moves off the local model too, then asks your
    # server for Google's image model and fails with a 404 that names neither.
    #
    # Observed exactly that: "AI tracing failed (404 Not Found for
    # .../v1/chat/completions)" from a llama.cpp host that answers that URL
    # perfectly well — it simply has no model called
    # google/gemini-3.1-flash-image-preview.
    #
    # So: if you set any key below, set this too. isnet is the local default and
    # needs no account anywhere.
    - key: TRACERS
      name: "Tracer — set this explicitly if you fill in ANY key below, or a naming key will move tracing off the local model"
      type: select
      default: ""
      options: ["", "isnet", "birefnet-lite", "inspyrenet", "gemini", "replicate", "fal"]
    - key: TRACEFINITY_ONNX_PROVIDER
      name: "Local tracer hardware — auto, cpu, or cuda (NVIDIA only)"
      type: select
      default: "auto"
      options: ["auto", "cpu", "cuda"]

    # Remote tracers. Each is only consulted when its own key is filled in.
    # secret:true is what actually encrypts these at rest; the panel does not
    # infer that from the name.
    - { key: GOOGLE_API_KEY, name: "Google Gemini API key — for the gemini tracer (optional; can also be typed in the app)", type: string, default: "", secret: true }
    - key: GEMINI_IMAGE_MODEL
      name: "Gemini model"
      type: select
      default: "gemini-3.1-flash-image-preview"
      options: ["gemini-3.1-flash-image-preview", "gemini-3-pro-image-preview", "gemini-2.5-flash-image"]
    # Only used when the tracer is gemini/openrouter AND the request is routed
    # through OPENROUTER_URL below. Its default is a Google model, which is
    # right for real OpenRouter and wrong for a local server — point it at a
    # model that host actually has, or tracing 404s.
    - { key: OPENROUTER_IMAGE_MODEL, name: "Image model for remote tracing (only if tracing through the endpoint below)", type: string, default: "google/gemini-3.1-flash-image-preview" }
    - { key: REPLICATE_API_TOKEN, name: "Replicate API token — for the replicate tracer (optional)", type: string, default: "", secret: true }
    - { key: FAL_KEY, name: "fal.ai key — for the fal tracer (optional)", type: string, default: "", secret: true }

    # ── Naming traced tools (optional, off by default) ────────────────────────
    # A different job from tracing, and a much smaller one: it sends a cropped
    # picture of each unnamed outline and gets back a short name. Vision in, text
    # out — so any vision-capable model can do it, unlike the tracers above,
    # which have to GENERATE a mask image.
    #
    # `openrouter` is the bring-your-own option as much as it is OpenRouter: the
    # endpoint below is overridable, and the request is ordinary OpenAI-style
    # chat completions, so a local llama.cpp or vLLM server works by pointing
    # OPENROUTER_URL at it and putting any non-empty string in the key. Use
    # `ollama` only for a real Ollama server — that provider speaks Ollama's own
    # API, not the OpenAI-compatible one.
    - key: TOOL_LABEL_PROVIDER
      name: "Name tools automatically"
      type: select
      default: "none"
      options: ["none", "ollama", "openrouter"]
    - { key: TOOL_LABEL_OLLAMA_URL, name: "Ollama server URL (ollama provider)", type: string, default: "http://localhost:11434" }
    - { key: TOOL_LABEL_MODEL, name: "Ollama vision model (ollama provider)", type: string, default: "qwen3-vl:4b" }
    - { key: OPENROUTER_URL, name: "Chat-completions endpoint — change this to use your own OpenAI-compatible server", type: string, default: "https://openrouter.ai/api/v1/chat/completions" }
    # ⚠️ Filling this in ALSO changes which tracer is used unless TRACERS above
    # is set explicitly. See the note there.
    - { key: OPENROUTER_API_KEY, name: "API key for that endpoint (any non-empty value for a local server — see the tracer note above)", type: string, default: "", secret: true }
    # A comma-separated list is tried in order. That exists for OpenRouter's
    # free tier, where the 20 requests/minute pool is shared per model across
    # every user of the service — so a popular model returns 429 because of
    # strangers, and the next one in the list takes over.
    - { key: OPENROUTER_LABEL_MODEL, name: "Model, or comma-separated fallback list", type: string, default: "google/gemini-2.0-flash-001" }
    # Naming runs SYNCHRONOUSLY, once per still-unnamed outline, so this timeout
    # is spent per tool in the photo rather than per trace. It matters most with
    # a local server that swaps models on demand: the first call pays the load,
    # and a model that needs longer than this is simply never heard from — the
    # outline keeps its generic "tool 1" and nothing says why. Measured against a
    # llama-swap host: a 3B vision model answered in ~6s, a 32B one in ~39s, i.e.
    # already past the default.
    - { key: TOOL_LABEL_TIMEOUT_SECONDS, name: "Seconds to wait per tool before giving up on a name", type: int, default: 30, min: 5, max: 300 }
    # Each crop is scaled to this on its longest edge before being sent. Larger
    # is not obviously better: it costs prompt tokens and time on every tool, and
    # a silhouette on paper is not a detail shot.
    - { key: TOOL_LABEL_MAX_CROP_PX, name: "Longest edge of each cropped tool image (px)", type: int, default: 512, min: 128, max: 2048 }

    # ── Uploads ───────────────────────────────────────────────────────────────
    - { key: MAX_UPLOAD_MB, name: "Largest photo it will accept (MB)", type: int, default: 20, min: 1, max: 200 }

  # Create the three working directories up front. The image's entrypoint makes
  # them itself when missing — but as root, and it then decides whether to chown
  # by looking at the TOP directory alone, which already matches PUID. The check
  # passes and three root-owned subdirectories are left behind, writable by
  # neither the app nor the panel. Observed on a first run: storage 999:982 with
  # uploads/, processed/ and outputs/ at 0:0.
  #
  # Doing it here needs no ownership guesswork at all: when install finishes the
  # panel runs its own `chown -R <its own uid>:<gid> /data` over the whole data
  # dir (install.go), so whatever this creates ends up correctly owned on every
  # install, whatever number the service account happens to have.
  install:
    image: "busybox:latest"
    script: |
      mkdir -p /data/uploads /data/processed /data/outputs
      echo "Storage prepared: uploads/, processed/, outputs/"

  startup:
    # Deliberately empty. With keep_entrypoint the image runs its own entrypoint
    # and its own CMD (supervisord), which is what it should do — a custom
    # command here is what forced the passwd shim in v1 and broke the start.
    command: ""
    # Wait for the BACKEND, not for supervisord. supervisord reports its three
    # programs up about three seconds in, but the backend then spends the best
    # part of a minute loading the tracer and paper-detection models — they stay
    # resident, so this is once per start, not per request. Measured on .164:
    # container up 06:11:01, "entered RUNNING state" 06:11:04, backend actually
    # serving 06:12:01.
    #
    # Finishing on the supervisord line marks the server running through that
    # whole window, and a page opened in it gets nginx's 502 HTML where it
    # expects JSON — which the app surfaces as the useless "[object Object]".
    done_regex: 'Application startup complete'

  ports:
    - { name: web, default: 3000, protocol: tcp }

  backup:
    include: ["."]
