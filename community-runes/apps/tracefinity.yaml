gameskill:
  id: tracefinity
  name: "Tracefinity"
  category: "Apps"
  description: >
    Photograph your tools and get printable Gridfinity bins shaped to them. You
    upload a picture of a drawer or a handful of tools, it traces each outline,
    and you download the models to print.

    Bring a Google Gemini API key if you want it to do the tracing for you —
    it can also be typed in the web interface instead, so the key never has to
    live on the server. Everything it produces is kept in the server's file
    area.
  author: "yggdrasil-community"
  version: 2
  icon: "app"

  # One container, one volume, no database — the project's own compose file is
  # three lines, and this rune is that with the panel's plumbing attached.
  #
  # keep_entrypoint AND user 0:0 together, exactly as the LinuxServer runes do —
  # and the pairing is load-bearing, not decoration. The panel writes a minimal
  # /etc/passwd into the container when a user is forced, so that getpwuid()
  # succeeds for game servers that call it; it skips that only when the rune
  # keeps the image's entrypoint. Setting user without keep_entrypoint therefore
  # replaces the passwd file and deletes the image's own `tracefinity` account,
  # and its entrypoint dies on `id -u tracefinity: no such user` before anything
  # starts. v1 of this rune did exactly that.
  #
  # The image starts as root, remaps its account to PUID:PGID and drops to it.
  #
  # :latest rather than the newest version tag. 0.4.0 — the most recent numbered
  # release — predates the project's rootless work and ships NO entrypoint at
  # all: it runs supervisord straight as root, so everything it writes into the
  # server's data directory ends up owned by root and the panel can no longer
  # manage its own files. :latest is a distinct digest from :dev, so this is the
  # release channel and not a development build.
  docker:
    image: "ghcr.io/tracefinity/tracefinity:latest"
    keep_entrypoint: true
    user: "0:0"
    data_path: /app/storage

  variables:
    # Same shape as the LinuxServer runes here. The image chowns its storage to
    # PUID:PGID, and that storage IS the panel's data directory for this server —
    # so a wrong value hands the server's files to a uid the panel isn't, and the
    # Files tab, backups and restores all stop working. The defaults are this
    # fleet's service account; the panel creates it with `useradd --system`, so
    # the number is whatever the OS had free (999 on two boxes here, 996 on a
    # third). Check with `id yggdrasil` if this install is not one of those.
    - key: PUID
      name: "Run-as UID (must own the data dir)"
      type: int
      default: 999
    - key: PGID
      name: "Run-as GID"
      type: int
      default: 982
    # Optional. The web interface can take a key per-session instead, which is
    # the better answer for a shared install — set this only if you want every
    # visitor to trace on your key. secret:true is what actually encrypts it at
    # rest; the panel does not infer that from the name.
    - { key: GOOGLE_API_KEY, name: "Google Gemini API key (optional — can be entered in the app instead)", type: string, default: "", secret: true }
    - key: GEMINI_IMAGE_MODEL
      name: "Gemini model"
      type: select
      default: "gemini-3-pro-image-preview"
      options: ["gemini-3-pro-image-preview", "gemini-2.5-flash-image"]
    - { key: MAX_UPLOAD_MB, name: "Largest photo it will accept (MB)", type: int, default: 20, min: 1, max: 200 }

  # Create the three working directories up front. The image's entrypoint makes
  # them itself when missing — but as root, and it then decides whether to chown
  # by looking at the TOP directory alone, which already matches PUID. The check
  # passes and three root-owned subdirectories are left behind, writable by
  # neither the app nor the panel. Observed on a first run: storage 999:982 with
  # uploads/, processed/ and outputs/ at 0:0.
  #
  # Doing it here needs no ownership guesswork at all: when install finishes the
  # panel runs its own `chown -R <its own uid>:<gid> /data` over the whole data
  # dir (install.go), so whatever this creates ends up correctly owned on every
  # install, whatever number the service account happens to have.
  install:
    image: "busybox:latest"
    script: |
      mkdir -p /data/uploads /data/processed /data/outputs
      echo "Storage prepared: uploads/, processed/, outputs/"

  startup:
    # Deliberately empty. With keep_entrypoint the image runs its own entrypoint
    # and its own CMD (supervisord), which is what it should do — a custom
    # command here is what forced the passwd shim in v1 and broke the start.
    command: ""
    done_regex: 'entered RUNNING state'

  ports:
    - { name: web, default: 3000, protocol: tcp }

  backup:
    include: ["."]
