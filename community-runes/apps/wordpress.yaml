gameskill:
  id: wordpress
  name: "WordPress"
  category: "Apps"
  description: "The world's most popular website/CMS. An app stack: the panel runs WordPress together with its own MariaDB database on a private network — no separate database rune to set up. Just pick a database password and go."
  author: "yggdrasil-community"
  version: 12
  icon: "app"

  # WordPress serves from /var/www/html (Apache). Runs the image's entrypoint as
  # root so Apache can bind its port and the entrypoint can populate the webroot.
  docker:
    image: "wordpress:latest"
    data_path: /var/www/html
    keep_entrypoint: true
    user: "0:0"
    # Fixed wiring to the bundled MariaDB sidecar (service name "db" = its DNS alias).
    env:
      WORDPRESS_DB_HOST: "db"
      WORDPRESS_DB_USER: "{{DB_USER}}"
      WORDPRESS_DB_PASSWORD: "{{DB_PASSWORD}}"
      WORDPRESS_DB_NAME: "{{DB_NAME}}"

  variables:
    - key: DB_NAME
      name: "Database name"
      type: string
      default: "wordpress"
    - key: DB_USER
      name: "Database user"
      type: string
      default: "wordpress"
    - key: DB_PASSWORD
      name: "Database password (change this)"
      type: string
      default: "change-me"
    - key: DB_ROOT_PASSWORD
      name: "Database root password (change this)"
      type: string
      default: "change-me-root"

  # The bundled database — reached by the app as "db". Its data lives in the panel
  # volume (under .stack/db), so a backup of this server captures the database too.
  services:
    - name: db
      image: "mariadb:lts"
      data_path: /var/lib/mysql
      env:
        MARIADB_DATABASE: "{{DB_NAME}}"
        MARIADB_USER: "{{DB_USER}}"
        MARIADB_PASSWORD: "{{DB_PASSWORD}}"
        MARIADB_ROOT_PASSWORD: "{{DB_ROOT_PASSWORD}}"

  install:
    image: "wordpress:latest"
    # Seed an .htaccess that raises PHP upload limits (plugin/theme/media uploads).
    # It lives in the webroot (mounted), so it survives container recreation; the
    # block sits above WordPress's own # BEGIN/END WordPress section, which WP
    # preserves when it manages permalinks. Apache mod_php reads php_value directives.
    script: |
      mkdir -p /data
      if ! grep -q "Yggdrasil upload limits" /data/.htaccess 2>/dev/null; then
        {
          echo "# BEGIN Yggdrasil upload limits"
          echo "<IfModule mod_php.c>"
          echo "php_value upload_max_filesize 128M"
          echo "php_value post_max_size 128M"
          echo "php_value memory_limit 512M"
          echo "php_value max_execution_time 300"
          echo "php_value max_input_time 300"
          echo "</IfModule>"
          echo "# END Yggdrasil upload limits"
          echo ""
          # Preserve any existing .htaccess below our block. Must be `if/then/fi`,
          # not `[ -f ] && cat`: on a fresh webroot the test returns non-zero, which
          # would make the whole { } group exit non-zero and the `&& mv` below never
          # run — leaving an orphan .htaccess.ygg and no .htaccess at all.
          if [ -f /data/.htaccess ]; then cat /data/.htaccess; fi
        } > /data/.htaccess.ygg
        mv /data/.htaccess.ygg /data/.htaccess
        chown 33:33 /data/.htaccess 2>/dev/null || true
        chmod 644 /data/.htaccess
      fi
      echo "WordPress webroot ready (PHP upload limit raised to 128M)"

  startup:
    command: ""
    done_regex: 'Command line:'

  ports:
    - { name: web, default: 80, protocol: tcp }

  backup:
    include: ["."]

  # Bring an existing WordPress site in: upload the webroot (wp-content etc.) and
  # a MySQL dump from the old host. The archive lands in the data dir, the dump is
  # loaded into the stack's MariaDB sidecar, and wp-config.php is rewritten to this
  # server's DB credentials so the site comes up against the panel's database.
  import:
    inputs:
      - key: wpress
        label: "All-in-One WP Migration export (.wpress) — files + database in one"
        accept: ".wpress"
        optional: true
      - key: files
        label: "…or a site archive (webroot: wp-content, uploads, …)"
        accept: ".tar.gz,.tgz,.tar,.zip"
        optional: true
      - key: db
        label: "…and/or a database dump (mysqldump .sql or .sql.gz)"
        accept: ".sql,.sql.gz,.gz"
        optional: true
    steps:
      - wpress:
          input: wpress
          to: "wp-content"
          db_key: wpressdb
      - unpack: files
        to: "."
      - db_import:
          input: db
          service: db
          image: "mariadb:lts"
          command: "mariadb -h db -u {{DB_USER}} -p{{DB_PASSWORD}} {{DB_NAME}}"
          # Wipe the schema first so the dump is authoritative — otherwise a
          # re-import over a database WordPress already seeded keeps its default
          # theme/active_plugins (the imported ones collide on existing keys).
          reset: true
      - db_import:
          input: wpressdb
          service: db
          image: "mariadb:lts"
          command: "mariadb -h db -u {{DB_USER}} -p{{DB_PASSWORD}} {{DB_NAME}}"
          reset: true
      - script: |
          set -e
          # Point the imported wp-config.php at this server's stack DB (the old
          # host's credentials won't match). Leaves everything else untouched.
          cfg=/data/wp-config.php
          if [ -f "$cfg" ]; then
            sed -i "s/define( *'DB_NAME'.*/define('DB_NAME', '{{DB_NAME}}');/" "$cfg"
            sed -i "s/define( *'DB_USER'.*/define('DB_USER', '{{DB_USER}}');/" "$cfg"
            sed -i "s/define( *'DB_PASSWORD'.*/define('DB_PASSWORD', '{{DB_PASSWORD}}');/" "$cfg"
            sed -i "s/define( *'DB_HOST'.*/define('DB_HOST', 'db');/" "$cfg"
            echo "wp-config.php repointed to the panel database"
          else
            echo "no wp-config.php in the archive — the image will generate one on first boot"
          fi
          # Pretty permalinks need WordPress's mod_rewrite block, but an import
          # never triggers a permalink save and AIO's archive carries no root
          # .htaccess — so without this every sub-page/login 404s. Add it once,
          # below the upload-limits block install already wrote.
          ht=/data/.htaccess
          touch "$ht"
          if ! grep -q "BEGIN WordPress" "$ht"; then
            cat >> "$ht" <<'HT'

          # BEGIN WordPress
          <IfModule mod_rewrite.c>
          RewriteEngine On
          RewriteBase /
          RewriteRule ^index\.php$ - [L]
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule . /index.php [L]
          </IfModule>
          # END WordPress
          HT
            echo "added WordPress rewrite rules to .htaccess"
          fi
          # The app serves as www-data (uid 33); imported files land owned by the
          # panel user, so uploads, caches, wflogs and .htaccess aren't writable.
          # Hand the whole tree to www-data.
          chown -R www-data:www-data /data
          echo "ownership handed to www-data"

  # Default Kvasir watchers — seeded per server as editable rules.
  watchers:
    # Bots probe theme/include .php files directly (e.g. functions.php), which
    # throws a harmless "Call to undefined function add_action()" fatal because WP
    # core isn't loaded. A single fatal is almost always that noise, so require a
    # burst — a genuinely broken site fails on every real request and clears this
    # quickly, while the odd scanner hit stays quiet.
    - name: "PHP fatal errors"
      pattern: "PHP Fatal error"
      threshold: 10
      window_secs: 600
      action: kvasir
    - name: "Login brute force"
      pattern: "POST /wp-login\\.php"
      threshold: 20
      window_secs: 120
      action: kvasir
    # XML-RPC is a classic brute-force / pingback-amplification vector. Real usage
    # (e.g. genuine Jetpack) is a trickle; a sustained flood — ~20+ in 5 min — is an
    # attack. Fires proactively so you hear about it without asking. Most modern
    # sites don't need xmlrpc.php at all and can block it at the proxy.
    - name: "XML-RPC flood"
      pattern: "POST /xmlrpc\\.php"
      threshold: 20
      window_secs: 300
      action: kvasir
    - name: "HTTP 5xx spike"
      pattern: '" 5\d\d '
      threshold: 10
      window_secs: 60
      action: kvasir

  # Persistent security-event history (complements the real-time watchers above):
  # each match is rolled up per client IP per hour into app_events, so "is this
  # site being brute-forced, and from where?" is answerable in the panel and by
  # Kvasir long after the access log scrolls away. Capture group 1 = client IP.
  events:
    - key: xmlrpc_hit
      label: "XML-RPC hit"
      match: '^(\S+) .*"POST /xmlrpc\.php'
    - key: wp_login_attempt
      label: "wp-login attempt"
      match: '^(\S+) .*"POST /wp-login\.php'
    - key: http_5xx
      label: "HTTP 5xx"
      match: '^(\S+) .*" 5\d\d '
